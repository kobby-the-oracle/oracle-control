name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./apps/api[dev]"
      - run: pytest -q apps/api/tests
      - run: ruff check apps/api/src apps/api/tests
      - run: cd apps/api && ORACLE_DATABASE_URL=sqlite:///./ci-migration.db alembic upgrade head
      - run: pip install -e "./packages/python-sdk[dev]"
      - run: pytest -q packages/python-sdk/tests
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: packages/typescript-sdk
      - run: npm run build
        working-directory: packages/typescript-sdk
